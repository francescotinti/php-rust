# Debian packaging build lane.
#
# Builds the phpr Debian packages (php-rust/debian) on the same distro
# the packages target and publishes them as workflow artifacts:
#   - phpr-cli_*_amd64.deb, phpr-server_*_amd64.deb
#   - native source set (.dsc, .tar.xz) + .changes/.buildinfo
#
# This lane is deliberately SEPARATE from ci.yml (the build-and-test
# gate for main): it does not run unit tests (they live in ci.yml and
# in the local oracle gates) and it only reacts to the packaging branch.
#
# Toolchain stance (php-rust pins rustc/cargo 1.98.1):
#   - Debian's rustc/cargo when they MATCH the pin — fully deterministic,
#     no rustup involved (debian:sid ships 1.98.x today);
#   - when Debian's compiler is not the pinned one (either direction),
#     install the PINNED toolchain with rustup and build with it. A
#     compiler change is a deliberate decision expressed by the pin, not
#     something a moving container tag smuggles in.
# The resolved absolute toolchain pair is handed to dpkg-buildpackage
# via CARGO/RUSTC (debian/rules honours both). debian/rules strips
# ~/.cargo/bin from the build PATH, so rustup's proxy shims stay inert
# even in rustup mode.
name: debian-packages

on:
  push:
    branches: [debian-packaging]
  workflow_dispatch:

permissions:
  contents: read

# The workspace layout: the git repo ROOT contains php-rust/ (the cargo
# workspace + debian/). dpkg-buildpackage runs in php-rust/ and writes
# its artifacts (../) to the repo root.
defaults:
  run:
    working-directory: php-rust

concurrency:
  group: debian-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    runs-on: ubuntu-latest
    # Same distro family as the packaging target (this box's verification
    # host: Debian forky/sid, rustc/cargo 1.98.1 = the project pin).
    container: docker.io/library/debian:sid
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies (from debian/control)
        # debian:sid ships no compiler: rustc/cargo arrive HERE, via the
        # Build-Depends declared in debian/control.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends dpkg-dev curl ca-certificates
          apt-get build-dep -y .

      - name: Report build environment
        run: |
          cat /etc/os-release | head -2
          dpkg --print-architecture
          rustc --version
          cargo --version

      # Resolves the build toolchain per the lane's policy and exposes
      # the absolute paths via step outputs.
      - name: Resolve toolchain (Debian's, or the pin via rustup)
        id: toolchain
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          debian_rustc=$(rustc --version | awk '{print $2}')
          echo "pinned: $pinned, debian sid ships: $debian_rustc"
          if [ "$pinned" = "$debian_rustc" ]; then
            echo "cargo=/usr/bin/cargo" >> "$GITHUB_OUTPUT"
            echo "rustc=/usr/bin/rustc" >> "$GITHUB_OUTPUT"
          else
            echo "Debian rustc ($debian_rustc) != pin ($pinned): installing the pinned toolchain via rustup"
            apt-get install -y --no-install-recommends rustup
            rustup toolchain install "$pinned" --profile minimal
            cargo_bin=$(rustup which --toolchain "$pinned" cargo)
            rustc_bin=$(rustup which --toolchain "$pinned" rustc)
            echo "cargo=$cargo_bin" >> "$GITHUB_OUTPUT"
            echo "rustc=$rustc_bin" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT" | sed 's/^/resolved: /'

      - name: Build packages
        env:
          CARGO: ${{ steps.toolchain.outputs.cargo }}
          RUSTC: ${{ steps.toolchain.outputs.rustc }}
        run: |
          dpkg-buildpackage -us -uc

      - name: Lintian (fail on errors; warnings reported)
        run: |
          apt-get install -y --no-install-recommends lintian
          lintian --pedantic --fail-on error ../*.changes

      # Installed-package smoke: the same tests autopkgtest would run on
      # a real testbed (debian/tests/{cli,server}), executed as root in
      # this container. dpkg -i needs no dependency resolution here: the
      # build-dep step already installed every runtime library.
      - name: Smoke test (installed packages)
        run: |
          dpkg -i ../phpr-cli_*_amd64.deb ../phpr-server_*_amd64.deb
          debian/tests/cli
          debian/tests/server

      - name: Collect artifacts
        run: |
          ls -l ..
          mkdir -p /tmp/out && cp ../*.deb ../*.dsc ../*.tar.xz ../*.changes ../*.buildinfo /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: phpr-debian-packages-amd64
          path: /tmp/out/*
          if-no-files-found: error
