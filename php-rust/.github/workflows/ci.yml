# Build + unit-test gate. The full PHP oracle gates (byte-identical output vs
# php-cli 8.5.7 and the Zend phpt corpus) run locally — they need the oracle
# binary and the php-src test corpus — but build + 1500+ unit tests here catch
# what those gates structurally cannot: cfg(test)-only breakage (a Ctx field
# addition once left `cargo test` uncompilable for several sessions) and
# platform drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # libz-sys links the SYSTEM zlib (deliberate: byte-identical deflate needs
      # PHP's exact library); zlib1g-dev ships on the runner image, this is a
      # guard for image changes.
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev pkg-config
      - name: Build (release)
        run: cargo build --release --workspace
      - name: Unit tests
        run: cargo test --release --workspace
      # A-AH2/A-AH3 (Council WP-78) + A-AH10 (Council WP-80) + A-AH16 (Council
      # WP-81): the php-server feature matrix is a QUINTET (default /
      # axum-only / census / census-axum-only / union) and the crate must be
      # warning-free in every configuration (KS-AH-78-2). The census
      # configuration was OUTSIDE the matrix and could bit-rot in silence
      # until measurement day; the census-axum-only weak-dep configuration
      # (S-80.0.5) was compiled by NOBODY — pinned here per KS-AH-81-4.
      # `cargo rustc` scopes -D warnings to the php-server crate alone
      # (dependency warnings stay warnings).
      - name: php-server feature matrix (fatal warnings)
        run: |
          cargo rustc --release -p php-server -- -D warnings
          cargo rustc --release -p php-server --no-default-features --features axum-server -- -D warnings
          cargo rustc --release -p php-server --features census-instrumentation -- -D warnings
          cargo rustc --release -p php-server --no-default-features --features census-instrumentation -- -D warnings
          cargo rustc --release -p php-server --features axum-server -- -D warnings
      # A-AH15 (Council WP-81): the census bracket/emitter code lives in
      # php-runtime and php-cli since S-79.0.3/6 — the php-server-scoped
      # passes above compile them as DEPENDENCIES, where warnings stay
      # warnings, so that code never saw -D at all.
      - name: cross-crate census lint (fatal warnings)
        run: |
          cargo rustc --release -p php-runtime --features census-instrumentation -- -D warnings
          cargo rustc --release -p php-cli --lib --features census-instrumentation -- -D warnings
      # A-SK4 (Council WP-78): worker_pool.rs and the axum handler only compile
      # under the feature — the default workspace test run above covers 0% of
      # that code. This step compiles AND runs the feature-gated gate tests.
      - name: php-server axum tests
        run: cargo test --release -p php-server --features axum-server
      # A-AH11 (Council WP-80) + A-AH17 (Council WP-81): the census build must
      # stay the FUNCTIONAL twin. This is a deliberate DOUBLE-RUN of the axum
      # gate tests (plain above, under census here) — the twin-check on the
      # test suite, not duplication. The census-only tests (split positive
      # controls, tripwires, drain) run only here.
      - name: php-server census tests (twin-check double-run)
        run: cargo test --release -p php-server --features census-instrumentation
      # A-AH15: the alloc_census integrity tests (LIFO trip, provider guard)
      # live in php-runtime and compile only under the feature — without this
      # step they would be a PASS on code cargo test never runs (the WP-78
      # Klabnik lesson).
      - name: php-runtime census tests
        run: cargo test --release -p php-runtime --lib --features census-instrumentation
      # A-AH17: the axum-only configuration's test targets otherwise never
      # compile anywhere — build them (no run: the union run above covers the
      # behavior; this pins compilability).
      - name: axum-only test targets compile
        run: cargo test --release -p php-server --no-default-features --features axum-server --no-run
      # A-AH24 (Council WP-82): same class for the FIFTH configuration — the
      # census-axum-only test targets compile nowhere else (symmetry with
      # A-AH17; an asymmetric build-only pin was unjustified).
      - name: census-axum-only test targets compile
        run: cargo test --release -p php-server --no-default-features --features census-instrumentation --no-run
      # S-78.1.3 (Council WP-79): the two shell grep-gates are pure-text and
      # cheap — running them here enforces KS-MS-4 (forbidden doc patterns) and
      # KS-PP-2/KS-PP-4 (capture order + allow-marker census) on every push.
      - name: doc-purge grep-gate (KS-MS-4)
        run: wp78-harness/gate-doc-purge.sh
      - name: capture-order grep-gate (KS-PP-2/KS-PP-4)
        run: wp78-harness/gate-capture-order.sh
