[package]
name = "php-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
php-cli = { path = "../php-cli", optional = true }
php-runtime.workspace = true
php-builtins = { path = "../php-builtins", optional = true }
php-types.workspace = true
mimalloc.workspace = true
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
hyper = { version = "1", optional = true }
num_cpus = { version = "1", optional = true }
static_assertions.workspace = true

[features]
default = ["cli-server"]
cli-server = ["php-cli"]
axum-server = ["tokio", "axum", "tower", "hyper", "php-builtins", "num_cpus"]
# S-78.1.6 (Council WP-79 A-BB7/A-BB8/A-BG7/A-DL7): census counters — alloc
# per phase, per-worker requests/RetainSet len/live objects, mpsc queue depth.
# KB-78-5/KL-78-5: footprint/peak verdicts come ONLY from the non-instrumented
# twin; this build produces counters, never figures.
census-instrumentation = ["axum-server"]
