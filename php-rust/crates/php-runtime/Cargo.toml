[package]
name = "php-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# WP-33 T0: compile in the op-census hook (PHPR_OP_CENSUS). Off by default:
# even a dead bool-branch per dispatch tick costs ~3% on op-dense workloads,
# so the census exists only in dedicated instrumentation builds.
op-census = []
# WP-39 leva E: GC-pipeline counters (PHPR_GC_CENSUS). Same convention as
# op-census: only ever compiled into dedicated instrumentation builds.
gc-census = []
# S-95.0 leva A-ZV1: contatori del MECCANISMO per «il clone che muore subito»
# (PHPR_ZVAL_CENSUS). Contano quanti valori vengono materializzati da uno slot
# e quanti di quelli portano un `Rc` (cioè pagano refcount++ / refcount--).
# Stessa convenzione delle altre census: SOLO build di strumentazione — una
# cifra verdict-grade non nasce mai da un binario con questa feature accesa.
zval-census = []
# WP-45 Fase 0: byte-attribution census (PHPR_MEM_CENSUS) — see
# FOOTPRINT_CPU_ROADMAP.md. Instrumentation builds only.
mem-census = ["php-types/mem-census"]
# WP-62 M2.3: form-B pre-quote diagnostic — identity class-id remap + zero
# static base in the hot arms (K-M1 arm-cost measurement). Never parity.
relbase-probe = []
# S-79.0.3 (Council WP-80 A-TH2/A-BB10): compile-phase sub-channel counters
# (a1 prelude / a3 include-compile) for the php-server census build. Same
# convention as the other census features: instrumentation builds only —
# verdict-grade figures never come from a build with this feature on.
census-instrumentation = []
# A-MS26/A-TH28 (Council WP-85): compile in the vm_gate_probe mint (mint 3,
# hand-replicated lifecycle tests in php-server's worker_pool.rs). Never a
# parity/campaign feature: a build without it does not CONTAIN the probe
# symbol, so KH85-1's "pub mint reachable outside tests" cannot recur.
vm-gate-probe = []
# S-103 leva-nulla (A-BA-103-4 → KS-BA-104-2, Council WP-104): a
# SEMANTICALLY NULL text-layout perturbation — one never-called
# #[inline(never)] #[no_mangle] pad function next to run_loop. Build arm B
# of the layout A/B with this feature; arm A is the pin. Never a parity
# feature; the measured |Δ| on the giudice IS the layout noise band.
null-lever = []
# S-139 az.rev. S-138 #2 (criterio s139-criterio-rmw-collaudo.md p.3): contatori
# fill/hit della cella IC RMW (PHPR_IC_STATS). Stessa convenzione delle census:
# SOLO build diagnostiche — mai nel pin; nessuna cifra di tempo da questa build.
ic-stats = []

[dependencies]
php-types.workspace = true
rustc-hash.workspace = true
log.workspace = true
log4rs.workspace = true
mago-syntax = "1.30"
mago-syntax-core = "1.30"
mago-database = "1.30"
mago-span = "1.30"
bumpalo = "3"
regex = "1"
fancy-regex = "0.14"
onig = "6.5.3"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
unicode-segmentation = "1.13"
libc = "0.2"
rusqlite = { version = "0.40.1", features = ["bundled", "column_decltype", "column_metadata", "functions"] }
mysql = "28.0.0"
elsa = "=1.11.2"
static_assertions.workspace = true

# A-AH29 (Council WP-83): the mem-census lib-test target could not LINK
# (php_types::memcensus calls mi_* symbols that only the bin crates'
# mimalloc provided) — the compile pin was structurally impossible and the
# selftests had to live as pub fns run from bin tests. Dev-only: production
# builds are untouched; the CI --no-run lane now bites for real.
[dev-dependencies]
mimalloc.workspace = true
