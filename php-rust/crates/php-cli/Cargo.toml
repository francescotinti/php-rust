[package]
name = "php-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "phpr"
path = "src/main.rs"

[features]
# WP-45 Fase 0: byte-attribution build (PHPR_MEM_CENSUS). Instrumentation
# builds only — never parity/A-B binaries. See FOOTPRINT_CPU_ROADMAP.md.
mem-census = ["php-runtime/mem-census", "php-types/mem-census"]
# WP-62 M2.3: form-B arm-cost diagnostic (see php-runtime/relbase-probe).
relbase-probe = ["php-runtime/relbase-probe"]
# S-95.0 leva A-ZV1: contatori del meccanismo «clone che muore subito»
# (PHPR_ZVAL_CENSUS=1 stampa la riga a fine processo). Strumentazione soltanto.
zval-census = ["php-runtime/zval-census"]
# S-79.0.6 (Council WP-80 A-BG16): per-request census line on the cli-server
# arm — the prerequisite for judging A-BB1 (the alloc A/B needed counters on
# BOTH arms; exit stats were never going to exist on this one, KG-79.B).
census-instrumentation = ["php-runtime/census-instrumentation"]

[dependencies]
php-types.workspace = true
php-runtime.workspace = true
php-builtins.workspace = true
log.workspace = true
libc = "0.2"
mimalloc.workspace = true
